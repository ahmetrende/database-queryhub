# CI render test: every option on. Placeholder values only.
image:
  repository: registry.example.com/queryhub
  tag: "1.0.0"
secrets:
  env: queryhub-env
  webEnv: queryhub-web-env
  migratorEnv: queryhub-migrator-env
  masterKey:
    name: queryhub-master-key
web:
  baseUrl: https://queryhub.example.com
  ingress:
    enabled: true
    className: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internal
    hosts:
      - host: queryhub.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: queryhub-tls
        hosts:
          - queryhub.example.com
init:
  adminUser: admin
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/queryhub
hostAliases:
  - ip: 192.0.2.10
    hostnames:
      - db1.internal.example.com
extraEnv:
  - name: EXAMPLE_FLAG
    value: "1"
extraVolumes:
  - name: changelog
    configMap:
      name: queryhub-changelog
extraVolumeMounts:
  - name: changelog
    mountPath: /etc/queryhub-site
    readOnly: true
jobDefaults:
  timeZone: Europe/Istanbul
jobs:
  clickhouse-catalog:
    enabled: true
  custom-sync:
    enabled: true
    schedule: "30 * * * *"
    args: ["python", "scripts/import_targets_from_inventory.py"]
