name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do **not** include secrets, real
        hostnames, account IDs, or personal data. For a security
        vulnerability, use private disclosure instead — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Slack (/sql)
        - Web UI
        - Executor / backend
        - Other / not sure
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: Database engine
      placeholder: PostgreSQL / SQL Server / other
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Version/commit, Python version, OS. Redact anything sensitive.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste logs or a traceback. Redact secrets and real identifiers.
      render: shell
